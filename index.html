<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cotizador</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#0e1a2b;--mu:#5b6678;--bd:#d9dee6;--hl:#ffd23f;--btn:#0e1a2b;--btnt:#fff;--err:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131d31;--ink:#eef2f8;--mu:#9aa6ba;--bd:#27344d;--btn:#ffd23f;--btnt:#0b1220;--err:#ff8a7a}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131d31;--ink:#eef2f8;--mu:#9aa6ba;--bd:#27344d;--btn:#ffd23f;--btnt:#0b1220;--err:#ff8a7a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:22px;margin:4px 0 14px;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:0 0 6px}
textarea,input[type=text],input[type=tel],input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:11px}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{border:1.5px solid var(--bd);border-radius:999px;padding:10px 16px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.total b{font-size:34px;font-variant-numeric:tabular-nums;background:linear-gradient(transparent 62%,var(--hl) 62%);padding:0 4px}
.sub{color:var(--mu);font-size:14px;margin-top:4px}
.warn{color:var(--err);font-weight:600;margin-top:8px;font-size:14px}
button.main{width:100%;background:var(--btn);color:var(--btnt);border:0;border-radius:12px;padding:15px;font:600 17px inherit;font-family:inherit;cursor:pointer}
button.main:disabled{opacity:.4}
button.lnk{background:none;border:0;color:var(--mu);font:inherit;text-decoration:underline;padding:8px 0;cursor:pointer}
.pr{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;margin-bottom:8px;font-size:15px}
.pr input{padding:8px}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Cotizador</h1>

<div class="card">
  <label for="msg">Mensaje del cliente (pégalo aquí)</label>
  <textarea id="msg" placeholder="Ej: necesito una cotización por 15 poleras y shorts sublimados"></textarea>
</div>

<div class="card">
  <div class="row">
    <div><label for="cli">Cliente</label><input type="text" id="cli" placeholder="Nombre"></div>
    <div><label for="tel">WhatsApp</label><input type="tel" id="tel" placeholder="569..." inputmode="tel"></div>
  </div>
  <div class="row" style="margin-top:12px"><div><label for="rut">RUT (opcional)</label><input type="text" id="rut"></div><div><label for="abono">Abono (CLP)</label><input type="number" id="abono" inputmode="numeric" placeholder="0"></div></div><label for="mail" style="margin-top:12px">Correo (opcional)</label><input type="text" id="mail" inputmode="email"><label style="margin-top:12px">Prendas</label>
  <div class="chips" id="prendas">
    <button class="chip" data-k="polera" aria-pressed="false">Polera</button>
    <button class="chip" data-k="short" aria-pressed="false">Short</button>
    <button class="chip" data-k="media" aria-pressed="false">Medias</button>
  </div>
  <div id="shortType" hidden>
    <label style="margin-top:12px">Tipo de short</label>
    <div class="chips">
      <button class="chip" data-t="C" aria-pressed="true">Costura</button>
      <button class="chip" data-t="S" aria-pressed="false">Sublimado</button>
    </div>
  </div>
  <label for="qty" style="margin-top:12px">Cantidad</label>
  <input type="number" id="qty" inputmode="numeric" min="1" placeholder="0">
</div>

<div class="card">
  <div class="total"><span id="desc" class="sub">Elige prendas y cantidad</span><b id="tot">$0</b></div>
  <div class="sub" id="unit"></div>
  <div class="warn" id="warn" hidden></div>
</div>

<button class="main" id="go" disabled>Crear PDF y compartir</button>
<div style="text-align:center"><button class="lnk" id="cfg">Editar precios</button></div>

<div class="card" id="panel" hidden>
  <label>Precios por unidad (CLP) — provisorios</label>
  <div id="prices"></div>
  <div class="sub">Mínimo 8 unidades. Sobre 50 requiere autorización del jefe.</div>
</div>
</main>

<script>
const MIN=8, MAX=50;
const NAMES={polera:'Polera',shortC:'Short costura',shortS:'Short sublimado',media:'Medias',pol_shortC:'Polera + short costura',pol_shortS:'Polera + short sublimado',pol_shortC_media:'Polera + short costura + medias',pol_shortS_media:'Polera + short sublimado + medias'};
const DEF={polera:15900,shortC:6500,shortS:6500,media:3500,pol_shortC:22900,pol_shortS:22900,pol_shortC_media:24900,pol_shortS_media:24900};
let P={...DEF}, empresa='';
try{const s=JSON.parse(localStorage.getItem('cot_cfg')||'null');if(s){P={...DEF,...s.P};empresa=s.empresa||''}}catch(e){}
const $=id=>document.getElementById(id);
const sel={polera:false,short:false,media:false}; let tipo='C';
const fmt=n=>'$'+Math.round(n).toLocaleString('es-CL');
function save(){try{localStorage.setItem('cot_cfg',JSON.stringify({P,empresa}))}catch(e){}}

function calc(){
  const q=parseInt($('qty').value)||0, t=tipo==='C'?'shortC':'shortS';
  const parts=[];if(sel.polera)parts.push('pol');if(sel.short)parts.push('short');if(sel.media)parts.push('media');
  if(!parts.length)return {q,unit:0,name:''};
  let key=(sel.polera?'pol_':'')+(sel.short?(tipo==='C'?'shortC':'shortS'):'')+(sel.media&&(sel.polera||sel.short)?'_media':'');
  key=key.replace(/^_/,'').replace('pol__','pol_');
  let unit,name;
  if(P[key]&&parts.length>1){unit=P[key];name=NAMES[key]}
  else{
    const items=[];if(sel.polera)items.push('polera');if(sel.short)items.push(t);if(sel.media)items.push('media');
    unit=items.reduce((a,k)=>a+P[k],0);name=items.map(k=>NAMES[k]).join(' + ');
  }
  return {q,unit,name};
}
function render(){
  $('shortType').hidden=!sel.short;
  const {q,unit,name}=calc(); const tot=q*unit;
  $('tot').textContent=fmt(tot);
  $('desc').textContent=name?`${q||0} × ${name}`:'Elige prendas y cantidad';
  $('unit').textContent=unit?`${fmt(unit)} por unidad`:'';
  let w='',ok=unit>0&&q>0;
  if(q>0&&q<MIN){w=`Pedido mínimo: ${MIN} unidades.`;ok=false}
  if(q>MAX){w='Más de 50 unidades: requiere precio y autorización del jefe.';ok=false}
  $('warn').hidden=!w;$('warn').textContent=w;$('go').disabled=!ok;
}
function parse(){
  const m=$('msg').value.toLowerCase(); if(!m.trim())return;
  const n=m.match(/\d+/); if(n)$('qty').value=n[0];
  sel.polera=/poler|camiset/.test(m);sel.short=/short/.test(m);sel.media=/medi[ao]/.test(m);
  if(/sublim/.test(m))tipo='S';else if(/costur|numero|número/.test(m))tipo='C';
  sync();render();
}
function sync(){
  document.querySelectorAll('#prendas .chip').forEach(b=>b.setAttribute('aria-pressed',sel[b.dataset.k]));
  document.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===tipo));
}
$('msg').addEventListener('input',parse);
$('qty').addEventListener('input',render);
document.querySelectorAll('#prendas .chip').forEach(b=>b.onclick=()=>{sel[b.dataset.k]=!sel[b.dataset.k];sync();render()});
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tipo=b.dataset.t;sync();render()});

// Panel de precios
function buildPrices(){
  $('prices').innerHTML='';
  Object.keys(NAMES).forEach(k=>{
    const r=document.createElement('div');r.className='pr';
    const l=document.createElement('span');l.textContent=NAMES[k];
    const i=document.createElement('input');i.type='number';i.inputMode='numeric';i.value=P[k];
    i.oninput=()=>{P[k]=parseInt(i.value)||0;save();render()};
    r.append(l,i);$('prices').append(r);
  });
}

$('cfg').onclick=()=>{$('panel').hidden=!$('panel').hidden;if(!$('panel').hidden)buildPrices()};

  [['CONTACTO','Michelle Rosales'],['SOCCER-FACTORY','76.400.658-5'],['cel/whatsapp','+56 9 93554007'],['Mail','ventas@soccer-factory.cl']].forEach((r,i)=>{font('normal',9);t(r[0],108,40+i*7);t(r[1],140,40+i*7)});
  font('normal',8);t('AV PROVIDENCIA 2529 LOCAL 25, PROVIDENCIA, SANTIAGO',108,68);

$('go').onclick=async()=>{
  const r=makePdf(); const f=new File([r.blob],r.file,{type:'application/pdf'});
  const txt=`Hola ${r.cli}, te envío la cotización: ${r.q} × ${r.name} = ${fmt(r.tot)}.`;
  try{
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:txt});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{
    if(window.claude&&window.claude.use){const dl=await window.claude.use('downloads');await dl.save({filename:r.file,data:r.blob})}
    else{const u=URL.createObjectURL(r.blob),a=document.createElement('a');a.href=u;a.download=r.file;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
  }catch(e){}
  const tel=$('tel').value.replace(/\D/g,'');
  if(tel)window.open('https://wa.me/'+tel+'?text='+encodeURIComponent(txt),'_blank');
};
render();
</script>
</body>
</html>
